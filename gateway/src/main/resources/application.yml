server:
  port: 19091

spring:
  main:
    web-application-type: reactive
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: order-service  # 라우트 식별자
            uri: lb://order-service # 'order-service'라는 이름으로 로드 밸런싱된 서비스로 라우팅
            predicates:
              - Path=/order/** # /order/** 경로로 들어오는 요청을 이 라우트로 처리
          - id: product-service  # 라우트 식별자
            uri: lb://product-service  # 'product-service'라는 이름으로 로드 밸런싱된 서비스로 라우팅
            predicates:
              - Path=/product/** #/product/** 경로로 들어오는 요청을 이 라우트로 처리  # 서비스 디스커버리를 통해 동적으로 라우트를 생성하도록 설정
          - id: auth-service
            uri: lb://auth-service
            predicates:
              - Path=/auth/signIn
          discovery:
            locator:
              enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

