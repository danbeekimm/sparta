<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Study</title>
    <link rel="stylesheet" href="/chatbot/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="chat-wrapper">
    <header class="chat-header">
        <div class="status-indicator"></div>
        <h1>Spring AI Assistant</h1>
    </header>

    <main class="chat-body" id="chatWindow">
        <div class="message-row system">
            <div class="bubble">안녕하세요! 무엇을 도와드릴까요?</div>
        </div>
    </main>

    <footer class="chat-input-container">
        <input type="text" id="userInput" placeholder="질문을 입력하세요..." autocomplete="off">
        <button id="sendBtn">
            <i class="fas fa-paper-plane"></i>
        </button>
    </footer>
</div>
<script src="/chatbot/chat.js"></script>
</body>
</html>
